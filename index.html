<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WayDeym ◆ Solidaritas Indonesia</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png" type="image/png">
    <meta name="theme-color" content="#0f172a">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <div class="glass-panel">
        <div class="panel-header">
            <h3>WayDeym<span class="dot">◆</span></h3>
            <p class="subtitle">INDONESIA SOLIDARITY</p>
        </div>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Nama Panggilan..." autocomplete="off">
            <input type="password" id="pin" placeholder="PIN Keamanan (Opsional)">
        </div>

        <button id="btnStart">Mulai Jejak</button>
        
        <div id="status">Sistem siap. Ketuk tombol untuk mulai.</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
